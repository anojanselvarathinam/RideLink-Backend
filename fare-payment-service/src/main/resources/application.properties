spring.application.name=fare-payment-service

# Local MongoDB (change to your Atlas/connection string if remote).
# NOTE: Spring Boot 4 renamed the connection property from
# spring.data.mongodb.uri -> spring.mongodb.uri (the old name is ignored).
spring.mongodb.uri=mongodb://localhost:27017/ridelink_fare_payment_db

# Ride Management Service (Member 3).
# Synchronous REST call used when finalizing a fare to fetch the completed
# ride's ACTUAL distance (authoritative input for the final fare, by rideId).
# If the service is unreachable, finalization falls back to the estimated
# distance (fare.distanceSource = ESTIMATE) - no cross-service DB access.
ride-management.base-url=http://localhost:8082

# --- Authentication (JWT resource server) -----------------------------------
# The HS256 signing secret is read ONLY from the environment variable
# RIDELINK_JWT_SECRET (>= 32 bytes) and is deliberately NOT stored in this file
# or anywhere in the repository (brief 6.3: no committed secrets).
#   Windows PowerShell:  $env:RIDELINK_JWT_SECRET = "<shared-secret>"
#   Linux/macOS:         export RIDELINK_JWT_SECRET="<shared-secret>"
# The app fails fast at startup if the variable is missing.
# The SAME secret must be configured for account-service (the token issuer).
